<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#08182f">
    <meta name="description" content="Care for a tiny sea lion on a living WebGL coast.">
    <title>Seagotchi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Micro+5&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/ai-playground/games/seagotchi/assets/index-BcxyE-gr.js"></script>
    <link rel="stylesheet" crossorigin href="/ai-playground/games/seagotchi/assets/index-CvWobb9z.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand-lockup">
          <span class="mini-label">POCKET COAST</span>
          <h1>SEAGOTCHI</h1>
        </div>
        <div class="header-controls">
          <a class="github-link" href="https://github.com/diegopacheco/ai-playground/tree/main/pocs/seagotchi-gpt-5-6-sol" aria-label="View Seagotchi on GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 .7A11.5 11.5 0 0 0 8.4 23c.6.1.8-.3.8-.6v-2.2c-3.4.7-4.1-1.4-4.1-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.9-.8c1.1 0 2.1.1 3 .4 2.2-1.5 3.2-1.2 3.2-1.2.6 1.5.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.2v3.2c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"/>
            </svg>
          </a>
          <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true">SOUND ON</button>
          <div class="day-box">
            <span>DAY</span>
            <strong id="day-number">01</strong>
          </div>
        </div>
      </header>

      <section class="game-frame">
        <div class="scene-wrap" id="scene-wrap">
          <canvas id="ocean-canvas" aria-label="Animated sea lion resting on a rock in the ocean"></canvas>
          <div class="sun-label">LA JOLLA, CA</div>
          <div class="scanlines"></div>

          <button class="costume-button" id="costume-button" type="button" aria-expanded="false" aria-controls="costume-panel" aria-label="Open costume closet">
            <svg viewBox="0 0 32 28" aria-hidden="true">
              <path d="M11 2h10l2 5 7 4-4 7-4-2v10H10V16l-4 2-4-7 7-4 2-5Zm3 3-1 4h6l-1-4h-4Z"/>
            </svg>
            <span>COSTUME</span>
          </button>

          <section class="costume-panel" id="costume-panel" aria-label="Costume closet" hidden>
            <div class="closet-heading">
              <strong>COVE CLOSET</strong>
              <button id="costume-close" type="button" aria-label="Close costume closet">×</button>
            </div>
            <fieldset>
              <legend>COAT</legend>
              <div class="costume-options coat-options" role="radiogroup" aria-label="Coat color">
                <button class="costume-option" type="button" data-coat="brown" role="radio" aria-checked="true"><i class="brown-swatch"></i>BROWN</button>
                <button class="costume-option" type="button" data-coat="gray" role="radio" aria-checked="false"><i class="gray-swatch"></i>GRAY</button>
                <button class="costume-option" type="button" data-coat="white" role="radio" aria-checked="false"><i class="white-swatch"></i>WHITE</button>
              </div>
            </fieldset>
            <fieldset>
              <legend>HEAD</legend>
              <div class="costume-options hat-options" role="radiogroup" aria-label="Hat">
                <button class="costume-option" type="button" data-hat="none" role="radio" aria-checked="true">NO HAT</button>
                <button class="costume-option" type="button" data-hat="crown" role="radio" aria-checked="false">GOLDEN CROWN</button>
                <button class="costume-option" type="button" data-hat="blue" role="radio" aria-checked="false">BLUE HAT</button>
                <button class="costume-option" type="button" data-hat="viking" role="radio" aria-checked="false">VIKING HAT</button>
                <button class="costume-option" type="button" data-hat="wig" role="radio" aria-checked="false">BLONDE WIG</button>
              </div>
            </fieldset>
          </section>

          <aside class="stats-panel" aria-label="Seagotchi status">
            <div class="stat">
              <div class="stat-heading">
                <span>FOOD</span>
                <strong id="food-value">78</strong>
              </div>
              <div class="meter"><i id="food-bar"></i></div>
            </div>
            <div class="stat">
              <div class="stat-heading">
                <span>SLEEP</span>
                <strong id="sleep-value">64</strong>
              </div>
              <div class="meter"><i id="sleep-bar"></i></div>
            </div>
            <div class="stat">
              <div class="stat-heading">
                <span>HAPPY</span>
                <strong id="happy-value">82</strong>
              </div>
              <div class="meter"><i id="happy-bar"></i></div>
            </div>
          </aside>

          <div class="speech" id="speech">BORK! THE TIDE IS NICE.</div>
          <div class="heart-layer" id="heart-layer"></div>

          <aside class="actions-panel" aria-label="Care actions">
            <span class="panel-title">CARE</span>
            <button class="action-button" id="feed-button" type="button">
              <svg viewBox="0 0 32 24" aria-hidden="true">
                <path d="M4 12 0 5v14l4-7Zm2-6h13l9 6-9 6H6l4-6-4-6Z"/>
                <rect x="20" y="9" width="3" height="3"/>
              </svg>
              <span>GIVE FISH</span>
            </button>
            <button class="action-button" id="sleep-button" type="button">
              <svg viewBox="0 0 32 24" aria-hidden="true">
                <path d="M4 18h18v4H0V2h4v16Zm3-9h8c4 0 7 3 7 7H7V9Zm18-7h7l-5 6h5v3h-9l5-6h-3V2Z"/>
              </svg>
              <span id="sleep-label">PUT TO SLEEP</span>
            </button>
            <button class="action-button" id="pet-button" type="button">
              <svg viewBox="0 0 32 24" aria-hidden="true">
                <path d="M7 3h4v8h2V0h4v11h2V2h4v10h2V6h4v10l-6 8H10l-7-9V8h4v7h2L7 3Z"/>
              </svg>
              <span>PET IT</span>
            </button>
            <button class="action-button" id="swim-button" type="button">
              <svg viewBox="0 0 32 24" aria-hidden="true">
                <path d="M2 8c4 0 4-3 8-3s4 3 8 3 4-3 8-3c2 0 3 .7 4 1.4v4C29 9.7 28 9 26 9c-4 0-4 3-8 3s-4-3-8-3-4 3-8 3V8Zm0 8c4 0 4-3 8-3s4 3 8 3 4-3 8-3c2 0 3 .7 4 1.4v4C29 17.7 28 17 26 17c-4 0-4 3-8 3s-4-3-8-3-4 3-8 3v-4Z"/>
              </svg>
              <span id="swim-label">GO SWIM</span>
            </button>
            <button class="action-button" id="share-button" type="button" aria-pressed="false">
              <svg viewBox="0 0 32 24" aria-hidden="true">
                <path d="M16 3a4 4 0 1 1-8 0 4 4 0 0 1 8 0Zm-1 7H9c-4 0-7 3-7 7v3h20v-3c0-4-3-7-7-7Zm12-4a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm-3 7h-2c2 2 3 4 3 7h7v-2c0-3-3-5-8-5Z"/>
              </svg>
              <span id="share-label">SHARE ROCK</span>
            </button>
          </aside>

          <div class="weight-tag">
            <span>SIZE</span>
            <strong id="weight-value">SLEEK</strong>
          </div>

          <div class="achievement" id="achievement" role="status" aria-live="polite">
            <span>ACHIEVEMENT UNLOCKED</span>
            <strong>CHONKERS</strong>
            <small>ABSOLUTE UNIT OF THE SEA</small>
          </div>
          <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
        </div>
      </section>

      <footer class="footer-strip">
        <p><span class="live-dot"></span> TIDE LINK ACTIVE</p>
        <p>BLUBBER · CALIFORNIA SEA LION</p>
        <p id="clock">08:42 AM</p>
      </footer>
    </main>
  </body>
</html>
