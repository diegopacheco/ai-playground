<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1240" viewBox="0 0 1240 1240" font-family="'Caveat','Chalkboard SE','Comic Sans MS',cursive">
<defs>
<filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Q4,6 0,0" fill="#334155"/></marker>
</defs>
<rect width="1240" height="1240" fill="#ffffff"/>
