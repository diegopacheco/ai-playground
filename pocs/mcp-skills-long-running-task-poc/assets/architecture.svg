<path d="M312,320 Q353,252 418,160" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)" filter="url(#wob)"/><circle cx="350" cy="228" r="16" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="350" y="236" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">1</text>
