<rect x="420" y="100" width="340" height="120" rx="16" fill="#dcfce7" stroke="#334155" stroke-width="2.5" filter="url(#wob)"/><text x="590" y="139.2" text-anchor="middle" font-size="30" font-weight="700" fill="#1e293b">Skills extension</text><text x="590" y="169.1" text-anchor="middle" font-size="24"  fill="#1e293b">skills/list, resources/read</text><text x="590" y="199" text-anchor="middle" font-size="24"  fill="#1e293b">skill:// URIs + digests</text>
