<path d="M762,160 Q812,148 838,160" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)" filter="url(#wob)"/>
<path d="M762,315 Q810,317.5 838,340" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)" filter="url(#wob)"/>
<path d="M762,465 Q790,462.5 838,440" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)" filter="url(#wob)"/>
<path d="M990,522 Q1008,532 1010,558" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)" filter="url(#wob)"/>
<text x="620" y="720" text-anchor="middle" font-size="26" fill="#1e293b">1 load skills on demand</text><text x="620" y="755" text-anchor="middle" font-size="26" fill="#1e293b">2 start the report and get a task handle at once</text><text x="620" y="790" text-anchor="middle" font-size="26" fill="#1e293b">3 poll the status, read the result, or cancel</text>
