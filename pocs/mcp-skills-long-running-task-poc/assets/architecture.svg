<rect x="420" y="410" width="340" height="110" rx="16" fill="#fce7f3" stroke="#334155" stroke-width="2.5" filter="url(#wob)"/><text x="590" y="459.15000000000003" text-anchor="middle" font-size="30" font-weight="700" fill="#1e293b">tasks/get</text><text x="590" y="489.05" text-anchor="middle" font-size="24"  fill="#1e293b">tasks/cancel</text>
<rect x="840" y="100" width="330" height="120" rx="16" fill="#f1f5f9" stroke="#334155" stroke-width="2.5" filter="url(#wob)"/><text x="1005" y="139.2" text-anchor="middle" font-size="30" font-weight="700" fill="#1e293b">skills/ folder</text><text x="1005" y="169.1" text-anchor="middle" font-size="24"  fill="#1e293b">market-research</text><text x="1005" y="199" text-anchor="middle" font-size="24"  fill="#1e293b">task-etiquette</text>
<rect x="840" y="260" width="330" height="260" rx="16" fill="#ede9fe" stroke="#334155" stroke-width="2.5" filter="url(#wob)"/><text x="1005" y="339.3" text-anchor="middle" font-size="30" font-weight="700" fill="#1e293b">TaskStore</text><text x="1005" y="369.2" text-anchor="middle" font-size="24"  fill="#1e293b">working</text><text x="1005" y="399.1" text-anchor="middle" font-size="24"  fill="#1e293b">completed / failed</text><text x="1005" y="429" text-anchor="middle" font-size="24"  fill="#1e293b">cancelled</text><text x="1005" y="458.9" text-anchor="middle" font-size="24"  fill="#1e293b">TTL expiry</text>
