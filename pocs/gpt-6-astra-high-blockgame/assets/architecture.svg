<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="460"
  viewBox="0 0 1000 460"
>
  <defs>
    <filter id="wobble">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".025"
        numOctaves="2"
        seed="12"
      />
      <feDisplacementMap in="SourceGraphic" scale="1.4" />
    </filter>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="3"
      orient="auto"
    >
      <path d="M0 0 8 3 0 6" fill="none" stroke="#47614a" stroke-width="1.5" />
    </marker>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;display=swap");
      text {
        font-family: Caveat, cursive;
        fill: #38543d;
        font-size: 24px;
      }
      .small {
        font-size: 19px;
      }
    </style>
  </defs>
  <rect width="1000" height="460" rx="22" fill="#f8f7ef" />
  <text x="45" y="49" style="font-size: 32px">
    A little world, running right in your browser.
  </text>
  <g filter="url(#wobble)" stroke="#62745b" stroke-width="2" fill="none">
    <rect x="45" y="115" width="200" height="105" rx="13" fill="#e2ebd5" />
    <rect x="365" y="115" width="250" height="105" rx="13" fill="#f4e5bd" />
    <rect x="745" y="115" width="210" height="105" rx="13" fill="#d5e9e8" />
    <rect x="365" y="315" width="250" height="95" rx="13" fill="#efdbd0" />
    <rect x="745" y="315" width="210" height="95" rx="13" fill="#e2e8d5" />
    <path
      d="M245 165h113M615 165h123M490 220v88M615 362h123"
      marker-end="url(#arrow)"
    />
  </g>
  <text x="145" y="155" text-anchor="middle">Desktop + mobile</text>
  <text x="145" y="187" text-anchor="middle" class="small">
    Mouse, keyboard, touch
  </text>
  <text x="490" y="153" text-anchor="middle">The block world</text>
  <text x="490" y="185" text-anchor="middle" class="small">
    Terrain map + player edits
  </text>
  <text x="850" y="153" text-anchor="middle">Three.js → WebGL 2</text>
  <text x="850" y="185" text-anchor="middle" class="small">
    Instanced blocks + scenery
  </text>
  <text x="490" y="349" text-anchor="middle">Browser localStorage</text>
  <text x="490" y="382" text-anchor="middle" class="small">
    Save only what you change
  </text>
  <text x="850" y="350" text-anchor="middle">Your next visit</text>
  <text x="850" y="382" text-anchor="middle" class="small">
    Regrow terrain + apply edits
  </text>
  <text x="276" y="146" class="small">interact</text>
  <text x="647" y="145" class="small">render</text>
  <text x="505" y="272" class="small">autosave</text>
  <text x="647" y="343" class="small">restore</text>
  <text x="47" y="325" class="small">Node.js serves local files.</text>
  <text x="47" y="353" class="small">No accounts. No database.</text>
  <text x="47" y="381" class="small">Just a little sunshine.</text>
</svg>
