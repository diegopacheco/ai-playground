<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bifrost MCP Math</title>
<style>
:root { --bg: #f6f7fb; --card: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e4e7ec; --accent: #4f46e5; --bad: #b42318; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
h1 { margin: 0 0 4px; font-size: 24px; }
p.sub { margin: 0 0 24px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
select, input, textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; color: var(--ink); }
textarea { min-height: 110px; resize: vertical; }
button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #eef2ff; color: var(--accent); }
.answer { white-space: pre-wrap; }
.error { color: var(--bad); }
.presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.preset { margin: 0; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 500; }
.preset:hover { border-color: var(--accent); color: var(--accent); }
.tools { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.tools h2 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.tools ol { margin: 0; padding-left: 20px; font-family: ui-monospace, monospace; font-size: 13px; }
.tools li.failed { color: var(--bad); }
.route { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Bifrost MCP Math</h1>
  <p class="sub">Python 3.14 app, then Bifrost on :8080, which gives the CLI model the math MCP server tools and runs every tool call it asks for.</p>
  <form class="card" id="form">
    <div class="row">
      <div><label for="provider">Provider</label><select id="provider"></select></div>
      <div><label for="model">Model</label><input id="model" required></div>
    </div>
    <label>Math queries</label>
    <div class="presets" id="presets"></div>
    <label for="question">Question</label>
    <textarea id="question" required>What is (1234 * 5678) + 91?</textarea>
    <div class="route" id="route"></div>
    <button id="ask" type="submit">Ask through Bifrost</button>
  </form>
  <section class="card" id="result" hidden>
    <div class="meta" id="meta"></div>
    <div class="answer" id="answer"></div>
    <div class="tools" id="tools" hidden>
      <h2>MCP tool calls Bifrost ran on the math server</h2>
      <ol id="calls"></ol>
    </div>
  </section>
</main>
<script>
const defaults = { "claude-cli": "claude-sonnet-5", "codex-cli": "gpt-5.6-luna", "agy-cli": "gemini-3.8-flash-low", "ollama-cli": "llama3.2" };
const queries = [
  "What is (1234 * 5678) + 91?",
  "I have 250 dollars, spend 37.5 and split the rest between 4 friends. How much does each get?",
  "What is the average of 12, 18 and 27?",
  "Convert 98.6 Fahrenheit to Celsius: subtract 32, multiply by 5, divide by 9.",
  "What is 10 divided by 0?",
];
const question = document.getElementById("question");
const presets = document.getElementById("presets");
queries.forEach(text => {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "preset";
  button.textContent = text.length > 38 ? `${text.slice(0, 36)}...` : text;
  button.title = text;
  button.addEventListener("click", () => { question.value = text; });
  presets.append(button);
});
const provider = document.getElementById("provider");
const model = document.getElementById("model");
const route = document.getElementById("route");
const showRoute = () => { route.textContent = `model sent to Bifrost: ${provider.value}/${model.value}`; };
provider.addEventListener("change", () => { model.value = defaults[provider.value] || ""; showRoute(); });
model.addEventListener("input", showRoute);
fetch("/api/providers").then(r => r.json()).then(data => {
  data.providers.forEach(name => provider.add(new Option(name, name)));
  model.value = defaults[provider.value];
  showRoute();
});
const chip = text => { const span = document.createElement("span"); span.className = "chip"; span.textContent = text; return span; };
document.getElementById("form").addEventListener("submit", async event => {
  event.preventDefault();
  const button = document.getElementById("ask");
  const result = document.getElementById("result");
  const meta = document.getElementById("meta");
  const answer = document.getElementById("answer");
  const tools = document.getElementById("tools");
  const calls = document.getElementById("calls");
  button.disabled = true;
  tools.hidden = true;
  calls.replaceChildren();
  button.textContent = "Waiting for the CLI...";
  meta.replaceChildren();
  answer.className = "answer";
  answer.textContent = "";
  try {
    const response = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ provider: provider.value, model: model.value, question: question.value }) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error);
    meta.append(chip(data.provider), chip(data.model), chip(`${data.latency_ms} ms`), chip(`${data.tool_calls.length} MCP calls`));
    answer.textContent = data.answer;
    data.tool_calls.forEach(call => {
      const item = document.createElement("li");
      item.className = call.error ? "failed" : "";
      item.textContent = `${call.tool}(${Object.entries(call.arguments).map(([key, value]) => `${key}=${value}`).join(", ")}) = ${call.result}`;
      calls.append(item);
    });
    tools.hidden = data.tool_calls.length === 0;
  } catch (failure) {
    answer.className = "answer error";
    answer.textContent = failure.message;
  }
  result.hidden = false;
  button.disabled = false;
  button.textContent = "Ask through Bifrost";
});
</script>
</body>
</html>
