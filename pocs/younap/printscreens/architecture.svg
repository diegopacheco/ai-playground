<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="1060" height="520" font-family="Caveat, cursive" fill="#1e1e1e">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#1e1e1e" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1060" height="520" fill="#ffffff"/>
  <g filter="url(#wobble)" stroke="#1e1e1e" stroke-width="2.5">
    <rect x="40" y="40" width="420" height="440" rx="14" fill="#dbeafe"/>
    <rect x="70" y="100" width="360" height="60" rx="10" fill="#fef9c3"/>
    <rect x="70" y="180" width="360" height="60" rx="10" fill="#fef9c3"/>
    <rect x="70" y="260" width="360" height="60" rx="10" fill="#dcfce7"/>
    <rect x="70" y="340" width="360" height="60" rx="10" fill="#fce7f3"/>
    <rect x="70" y="415" width="360" height="48" rx="10" fill="#f3f4f6"/>
    <rect x="660" y="60" width="340" height="120" rx="14" fill="#dcfce7"/>
    <rect x="660" y="330" width="340" height="130" rx="14" fill="#fee2e2"/>
    <g fill="none">
      <path d="M430 290 Q570 290 700 184" marker-end="url(#arrow)"/>
      <path d="M830 180 Q852 255 830 326" marker-end="url(#arrow)"/>
      <path d="M430 370 Q545 368 656 398" marker-end="url(#arrow)"/>
    </g>
  </g>
  <g font-size="26">
    <text x="60" y="78" font-size="30">Browser - Younap UI</text>
    <text x="90" y="138">Main window + visualizers</text>
    <text x="90" y="218">Playlist editor</text>
    <text x="90" y="298">YouTube search</text>
    <text x="90" y="378">Video window (IFrame player)</text>
    <text x="90" y="447" font-size="23">localStorage: playlist, volume, modes</text>
    <text x="680" y="100" font-size="30">Node server (zero deps)</text>
    <text x="680" y="134">static files</text>
    <text x="680" y="164">GET /api/search</text>
    <text x="680" y="372" font-size="30">YouTube</text>
    <text x="680" y="408">results page</text>
    <text x="680" y="440">IFrame player (audio + video)</text>
  </g>
  <g font-size="23" fill="#1d4ed8">
    <text x="480" y="328">GET /api/search?q=</text>
    <text x="862" y="246">fetch results page</text>
    <text x="862" y="272">read ytInitialData</text>
    <text x="478" y="430">IFrame Player API</text>
    <text x="478" y="456">play, pause, seek</text>
  </g>
</svg>
