<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2937; } .t { font-size: 30px; font-weight: 700; } .s { font-size: 23px; } .l { font-size: 21px; fill: #374151; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  </defs>
  <rect width="1100" height="1100" fill="#ffffff"/>
  <text x="550" y="52" text-anchor="middle" class="t" style="font-size:38px">Restate agentic workflow POC (Java 25)</text>

  <g filter="url(#wobble)" stroke="#1f2937" stroke-width="2.5">
    <rect x="50" y="120" width="320" height="170" rx="16" fill="#dbeafe"/>
    <rect x="470" y="100" width="580" height="370" rx="18" fill="#fef3c7"/>
    <rect x="500" y="170" width="250" height="110" rx="12" fill="#ffffff"/>
    <rect x="775" y="170" width="250" height="110" rx="12" fill="#ffffff"/>
    <rect x="500" y="320" width="525" height="120" rx="12" fill="#ffffff"/>
    <rect x="470" y="580" width="580" height="240" rx="18" fill="#dcfce7"/>
    <rect x="50" y="620" width="320" height="160" rx="16" fill="#f3e8ff"/>
    <rect x="470" y="910" width="580" height="140" rx="18" fill="#fce7f3"/>
  </g>

  <text x="210" y="168" text-anchor="middle" class="t">Browser UI</text>
  <text x="210" y="205" text-anchor="middle" class="s">Vite + React 19 + TanStack</text>
  <text x="210" y="238" text-anchor="middle" class="s">start a goal, live steps</text>
  <text x="210" y="270" text-anchor="middle" class="s">"See it running in Restate"</text>

  <text x="760" y="145" text-anchor="middle" class="t">Restate server 1.8.1 (podman)</text>
  <text x="625" y="212" text-anchor="middle" class="t" style="font-size:26px">Ingress :8280</text>
  <text x="625" y="248" text-anchor="middle" class="s">run/send, status</text>
  <text x="900" y="212" text-anchor="middle" class="t" style="font-size:26px">Admin + UI :9270</text>
  <text x="900" y="248" text-anchor="middle" class="s">SQL, invocation page</text>
  <text x="762" y="368" text-anchor="middle" class="t" style="font-size:26px">Durable journal + workflow state</text>
  <text x="762" y="408" text-anchor="middle" class="s">restate-data volume, every step recorded</text>

  <text x="760" y="625" text-anchor="middle" class="t">agent-service (Java 25) :9280</text>
  <text x="760" y="670" text-anchor="middle" class="s">AgentWorkflow.run</text>
  <text x="760" y="705" text-anchor="middle" class="s">plan  -&gt;  task 1..4  -&gt;  summarize</text>
  <text x="760" y="740" text-anchor="middle" class="s">Restate Java SDK 2.11, every agent call is a ctx.run</text>
  <text x="760" y="780" text-anchor="middle" class="s">AgentWorkflow.status (shared, read only)</text>

  <text x="210" y="668" text-anchor="middle" class="t">prompts/</text>
  <text x="210" y="708" text-anchor="middle" class="s">plan-goal.md</text>
  <text x="210" y="738" text-anchor="middle" class="s">execute-task.md</text>
  <text x="210" y="768" text-anchor="middle" class="s">summarize-run.md</text>

  <text x="760" y="955" text-anchor="middle" class="t">ProcessRunner -&gt; local CLI</text>
  <text x="760" y="995" text-anchor="middle" class="s">claude | codex | agy | ollama</text>
  <text x="760" y="1030" text-anchor="middle" class="s">picked by scripts/agent.conf</text>

  <g fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M370 180 Q 440 160 498 210"/>
    <path d="M300 290 Q 560 330 800 282"/>
    <path d="M640 442 Q 600 510 630 578"/>
    <path d="M900 578 Q 930 510 890 442"/>
    <path d="M760 822 Q 790 865 760 908"/>
    <path d="M370 700 Q 420 690 468 700"/>
  </g>
  <text x="420" y="138" text-anchor="middle" class="l">start</text><text x="420" y="160" text-anchor="middle" class="l">poll</text>
  <text x="235" y="328" text-anchor="middle" class="l">runs list + Restate button</text>
  <text x="520" y="520" text-anchor="middle" class="l">invoke, replay</text>
  <text x="520" y="545" text-anchor="middle" class="l">after a crash</text>
  <text x="1000" y="520" text-anchor="middle" class="l">journal each</text>
  <text x="1000" y="545" text-anchor="middle" class="l">step result</text>
  <text x="870" y="870" text-anchor="middle" class="l">ctx.run(agent.ask)</text>
  <text x="420" y="680" text-anchor="middle" class="l">load</text>
</svg>
