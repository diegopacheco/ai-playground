<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-MEN '97 — The Deck</title>
<style>
:root{--paper:#f6f0e2;--paper2:#efe6d2;--ink:#14110d;--ink2:#4a4237;--gold:#ffcf2e;--gold2:#ffb200;--blue:#2b46c8;--red:#e23b2e;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Trebuchet MS","Avenir Next",Verdana,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 12% 8%,#fff8e6 0%,transparent 45%),radial-gradient(circle at 88% 92%,#ffeec4 0%,transparent 50%),var(--paper);
  min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(var(--ink) 1px,transparent 1.2px);background-size:7px 7px;opacity:.07}
.wrap{position:relative;z-index:1;max-width:1640px;margin:0 auto;padding:28px 22px 90px}

header.hero{position:relative;border:5px solid var(--ink);border-radius:6px;
  background:linear-gradient(135deg,#ffd84d 0%,#ffb200 38%,#ff8a1f 100%);
  padding:34px 30px 30px;overflow:hidden;box-shadow:12px 12px 0 var(--ink);margin-bottom:34px}
header.hero::before{content:"";position:absolute;inset:-60%;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0deg 7deg,transparent 7deg 14deg);
  animation:spin 60s linear infinite;opacity:.35}
header.hero::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(#14110d 1.4px,transparent 1.6px);background-size:11px 11px;opacity:.13}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-inner{position:relative;z-index:2}
h1{font-size:clamp(44px,9vw,116px);line-height:.86;letter-spacing:-3px;font-weight:900;font-style:italic;
  text-transform:uppercase;color:#fff;
  text-shadow:3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),10px 10px 0 var(--red),10px 10px 0 var(--ink)}
h1 span{color:var(--gold);display:inline-block;transform:rotate(-3deg)}
.tag{display:inline-block;margin-top:16px;background:var(--ink);color:var(--gold);padding:9px 18px;border-radius:3px;
  font-weight:900;letter-spacing:4px;font-size:13px;text-transform:uppercase;transform:skewX(-9deg)}
.sub{margin-top:14px;max-width:680px;font-size:15px;font-weight:700;color:#3a2d10;line-height:1.5}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:4px solid var(--ink);background:#fff;
  border-radius:5px;padding:14px;margin-bottom:28px;box-shadow:7px 7px 0 var(--ink)}
.chip{border:3px solid var(--ink);background:var(--paper2);color:var(--ink);font-weight:900;text-transform:uppercase;
  letter-spacing:1.4px;font-size:12px;padding:9px 15px;border-radius:3px;cursor:pointer;transition:.16s}
.chip:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
.chip.on{background:var(--ink);color:var(--gold)}
.spacer{flex:1}
input[type=search]{border:3px solid var(--ink);border-radius:3px;padding:9px 13px;font:inherit;font-weight:700;
  background:var(--paper2);min-width:210px}
input[type=search]:focus{outline:none;background:#fff;box-shadow:3px 3px 0 var(--gold2)}
.count{font-weight:900;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ink2)}

.grid{display:grid;gap:28px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));perspective:1700px}
.card{position:relative;aspect-ratio:5/7;cursor:pointer;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.9,.25,1);will-change:transform}
.card .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden;
  box-shadow:9px 9px 0 rgba(20,17,13,.85);transition:box-shadow .3s}
.card:hover .face{box-shadow:15px 15px 0 rgba(20,17,13,.9)}
.card .back{transform:rotateY(180deg)}
.card.flip{transform:rotateY(180deg)!important}
.art{position:absolute;inset:0}
.art svg{width:100%;height:100%;display:block}

.foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 42%,rgba(120,255,240,.55) 48%,
    rgba(255,120,220,.5) 53%,rgba(255,235,110,.5) 58%,rgba(255,255,255,.16) 66%,transparent 76%);
  background-size:260% 260%;background-position:var(--fx,50%) var(--fy,50%);transition:opacity .3s}
.card:hover .foil{opacity:1}
.scan{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.10) 0 2px,transparent 2px 5px)}
.card:hover .scan{opacity:1}
.glare{position:absolute;inset:-40%;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.7),transparent 42%);
  mix-blend-mode:soft-light}
.card:hover .glare{opacity:1}

.chips{position:absolute;top:10px;right:10px;z-index:4;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.badge{font-weight:900;font-size:10px;letter-spacing:1.6px;padding:5px 9px;border-radius:2px;text-transform:uppercase;
  border:2.5px solid var(--ink);transform:skewX(-9deg)}
.badge.xmen{background:var(--blue);color:var(--gold)}
.badge.villain{background:var(--red);color:#fff}
.badge.ally{background:#127a4b;color:#eaffd8}
.season{background:var(--gold);color:var(--ink);font-weight:900;font-size:10px;padding:5px 9px;
  border:2.5px solid var(--ink);border-radius:2px;letter-spacing:1px}
.powers{position:absolute;left:12px;right:78px;bottom:14px;z-index:4;display:flex;flex-wrap:wrap;gap:5px;
  opacity:0;transform:translateY(8px);transition:.3s}
.card:hover .powers{opacity:1;transform:none}
.powers span{font-size:9.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:#fff;
  border:2px solid var(--ink);border-radius:99px;padding:3px 8px;background:rgba(20,17,13,.86)}

.back{background:linear-gradient(160deg,#1a1712,#2a2318 55%,#141109);color:var(--paper);
  border:5px solid var(--ink);padding:16px 15px;overflow-y:auto}
.back::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,207,46,.55) 1px,transparent 1.3px);background-size:9px 9px;opacity:.13}
.back-in{position:relative;z-index:2;display:flex;flex-direction:column;min-height:100%}
.back h4{font-size:21px;font-weight:900;font-style:italic;text-transform:uppercase;color:var(--gold);letter-spacing:-.4px;line-height:1}
.role{font-size:9.5px;letter-spacing:1.8px;font-weight:800;color:#c8bda4;text-transform:uppercase;margin-top:6px}
.quote{margin-top:10px;font-size:12px;font-style:italic;font-weight:700;line-height:1.32;
  border-left:3px solid var(--gold2);padding-left:9px;color:#fff5dd}
.bio{margin-top:9px;font-size:11.5px;line-height:1.42;color:#d9d0bd}
.stats{display:grid;gap:6px;margin-top:auto;padding-top:11px}
.stat{display:grid;grid-template-columns:48px 1fr 24px;align-items:center;gap:7px}
.stat b{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:#bdb29a;font-weight:900}
.bar{height:8px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .7s ease}
.card.flip .bar i{width:var(--w)}
.stat u{font-size:9.5px;font-weight:900;text-decoration:none;color:var(--gold);text-align:right}
.hint{margin-top:9px;font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:#8d8471;font-weight:800}

footer{margin-top:56px;text-align:center;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-inner">
      <h1>X-MEN <span>'97</span><br>THE DECK</h1>
      <div class="tag">Season 01 &nbsp;&bull;&nbsp; Season 02 &nbsp;&bull;&nbsp; Full Roster</div>
      <p class="sub">Every mutant, machine and monster of the animated revival. Hover a card for the holo-foil, click it to flip the dossier.</p>
    </div>
  </header>
  <div class="controls">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="X-MEN">X-Men</button>
    <button class="chip" data-f="VILLAIN">Villains</button>
    <button class="chip" data-f="ALLY">Allies</button>
    <span class="spacer"></span>
    <input type="search" id="q" placeholder="Search the roster...">
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <footer>Fan-made tribute deck &nbsp;&bull;&nbsp; X-Men '97 &nbsp;&bull;&nbsp; No official affiliation</footer>
</div>
<script>
const W=48,H=60,CX=23;
const shade=(h,f)=>{if(!h||h[0]!=='#')return h;const n=parseInt(h.slice(1),16);
  const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  return `#${((1<<24)+(c(n>>16&255)<<16)+(c(n>>8&255)<<8)+c(n&255)).toString(16).slice(1)}`;};

const mk=()=>Array.from({length:H},()=>Array(W).fill(null));
const put=(g,x,y,c)=>{if(c&&x>=0&&x<W&&y>=0&&y<H)g[y][x]=c;};
const box=(g,x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)put(g,x+i,y+j,c);};
const mbox=(g,x,y,w,h,c)=>{box(g,x,y,w,h,c);box(g,W-x-w,y,w,h,c);};
const line=(g,x1,y1,x2,y2,c,t)=>{const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1));
  for(let i=0;i<=n;i++)box(g,Math.round(x1+(x2-x1)*i/n),Math.round(y1+(y2-y1)*i/n),t||1,t||1,c);};

function toSvg(g){
  const by={};
  for(let y=0;y<H;y++){let x=0;
    while(x<W){const c=g[y][x];
      if(!c){x++;continue;}
      let n=1;while(x+n<W&&g[y][x+n]===c)n++;
      (by[c]=by[c]||[]).push(`M${x} ${y}h${n}v1h-${n}z`);
      x+=n;}}
  return Object.entries(by).map(([c,d])=>`<path fill="${c}" d="${d.join('')}"/>`).join('');
}

const POSES={
  power:{arms:'power',lf:[10,34],rf:[33,11]},
  fists:{arms:'fists',lf:[10,34],rf:[34,34]},
  wide: {arms:'wide', lf:[4,20], rf:[40,20]}
};
function poseOf(c){
  const props=(c.art.front||[]).some(f=>PROP[Array.isArray(f)?f[0]:f]);
  if(props)return POSES.power;
  const k=['power','fists','wide'];
  let h=0;for(const ch of c.name)h=(h*31+ch.charCodeAt(0))>>>0;
  return POSES[k[h%3]];
}

const HAIRB={
  long:(g,c)=>{mbox(g,16,7,2,15,c);},
  flow:(g,c)=>{mbox(g,15,6,3,20,c);},
  bob:(g,c)=>{mbox(g,16,7,2,9,c);},
  tail:(g,c)=>{box(g,31,8,2,11,c);box(g,32,14,2,6,c);},
  mane:(g,c)=>{box(g,14,2,20,19,c);
    [[13,6],[13,10],[13,14],[34,6],[34,10],[34,14],[17,0],[22,0],[27,0]].forEach(([x,y])=>box(g,x,y,1,2,c));},
  none:()=>{}
};
const HAIRF={
  cap:(g,c)=>{box(g,17,3,14,5,c);mbox(g,16,5,1,4,c);},
  spiky:(g,c)=>{HAIRF.cap(g,c);[18,21,25,28].forEach(x=>box(g,x,1,2,2,c));mbox(g,15,4,1,3,c);},
  widow:(g,c)=>{HAIRF.cap(g,c);box(g,23,8,2,1,c);},
  bald:()=>{},
  none:()=>{}
};

const EYE=(g,a)=>{
  const e=a.eyes||['normal','#2f6fd0'], t=e[0], c=e[1];
  if(t==='glow'||t==='demon'||t==='blank'){mbox(g,19,10,4,2,c);return;}
  mbox(g,19,10,4,2,'#ffffff');
  put(g,21,11,c);put(g,26,11,c);put(g,20,11,'#141109');put(g,27,11,'#141109');
};

const GEAR={
  visor:(g,a)=>{box(g,16,9,16,4,'#f2c518');box(g,17,10,14,2,a.mask[1]);},
  cowl:(g,a)=>{const c=a.mask[1];box(g,16,2,16,9,c);mbox(g,15,4,1,7,c);
    mbox(g,19,10,4,2,'#ffffff');put(g,21,11,'#141109');put(g,26,11,'#141109');
    [[14,2,2,3],[12,0,2,3],[10,-1,2,3]].forEach(([x,y,w,h])=>mbox(g,x,y,w,h,c));},
  helmet:(g,a)=>{const c=a.mask[1],d=a.mask[2]||shade(c,.7);
    box(g,16,1,16,8,c);mbox(g,15,9,2,7,c);box(g,17,7,14,2,d);},
  glasses:(g,a)=>{const c=a.mask[1];mbox(g,18,9,6,4,c);mbox(g,19,10,4,2,'#bfe9ff');box(g,23,10,2,1,c);},
  shades:(g,a)=>{box(g,17,5,14,2,a.mask[1]);},
  eyepatch:(g)=>{box(g,17,9,14,1,'#1d1a15');box(g,18,10,5,3,'#1d1a15');},
  techface:(g,a)=>{box(g,24,6,7,12,'#9aa4ad');box(g,25,10,4,2,a.mask[1]);
    box(g,25,8,5,1,'#5c666e');box(g,25,14,4,1,'#5c666e');},
  primeface:(g,a)=>{box(g,24,5,8,14,'#8f97a0');box(g,25,10,6,2,a.mask[1]);
    box(g,25,7,6,1,'#5b636b');box(g,25,15,5,1,'#5b636b');},
  sentinel:(g,a)=>{const c=a.mask[1],e=a.mask[2];
    box(g,15,2,18,17,c);box(g,16,8,16,4,'#241a34');
    box(g,17,9,5,2,e);box(g,26,9,5,2,e);
    box(g,19,14,10,3,'#241a34');box(g,20,15,8,1,e);
    mbox(g,13,3,2,3,c);},
  xcut:(g,a)=>{const c=a.mask[1];box(g,16,2,16,16,c);box(g,17,9,14,3,'#0d0f14');
    box(g,18,10,12,1,a.mask[2]);box(g,21,15,6,4,'#0d0f14');box(g,23,0,2,3,c);},
  headdress:(g,a)=>{const c=a.mask[1];box(g,14,0,20,4,c);mbox(g,14,4,3,7,c);put(g,23,2,a.mask[2]);put(g,24,2,a.mask[2]);},
  apoc:(g,a)=>{const c=a.mask[1];box(g,15,2,18,5,c);mbox(g,14,7,3,10,c);box(g,22,0,4,3,a.mask[2]);},
  hood:(g,a)=>{const c=a.mask[1];box(g,14,1,20,6,c);mbox(g,14,7,4,16,c);},
  horns:(g,a)=>{const c=a.mask[1];line(g,17,3,12,0,c,1);line(g,30,3,35,0,c,1);line(g,18,4,13,1,c,1);line(g,29,4,34,1,c,1);},
  goblin:(g,a)=>{const c=a.mask[1];box(g,16,8,16,5,c);mbox(g,19,10,4,2,'#ffe37a');
    line(g,16,8,13,5,c,1);line(g,31,8,34,5,c,1);},
  mojo:(g)=>{box(g,18,14,12,4,'#2b0f12');box(g,19,15,10,1,'#ffffff');
    mbox(g,13,4,2,2,'#c0392b');},
  none:()=>{}
};

function figure(a,p){
  const F=mk(), s=a.suit, sk=a.skin, sd=a.shade||shade(sk,.75);
  const hair=a.hair?a.hair[0]:'#2b2119', hair2=a.hair?a.hair[1]:hair;
  const gk=a.mask?a.mask[0]:'none', full=['sentinel','xcut'].includes(gk);
  if(a.cape){box(F,14,20,20,29,a.cape);box(F,16,22,16,27,shade(a.cape,.75));}
  if(!a.robot&&!full){
    const hb=a.hairBack||'none';
    const m={flow:'flow',longWavy:'long',straight:'long',dreads:'long',bob:'bob',ponytail:'tail',mane:'mane',puff:'cap'}[hb];
    if(m&&HAIRB[m])HAIRB[m](F,hair);
  }
  if(p.arms==='wide'){mbox(F,8,20,10,3,s.a);}
  else if(p.arms==='fists'){mbox(F,13,20,4,8,s.a);mbox(F,11,27,4,8,s.a);}
  else{box(F,13,20,4,8,s.a);box(F,11,27,4,8,s.a);box(F,31,20,4,7,s.a);box(F,33,13,4,8,s.a);}
  mbox(F,17,36,5,11,s.a);
  mbox(F,15,47,7,3,s.trim);
  box(F,17,32,14,5,s.trim);
  box(F,16,20,16,3,s.a);box(F,17,23,14,6,s.a);box(F,18,29,12,3,s.a);
  box(F,16,30,16,3,s.trim);
  box(F,21,18,6,2,sd);
  box(F,p.lf[0],p.lf[1],5,3,s.trim);box(F,p.rf[0],p.rf[1],5,3,s.trim);
  if(!a.robot){
    box(F,18,6,12,12,sk);
    if(a.pointyEars){box(F,17,8,1,3,sk);box(F,30,8,1,3,sk);}
    else{box(F,17,11,1,2,sk);box(F,30,11,1,2,sk);}
    if(!full){
      const bc=a.browColor||hair;
      box(F,19,9,4,1,bc);box(F,25,9,4,1,bc);
      if(!['visor','cowl','sentinel','xcut','primeface','goblin','eyepatch'].includes(gk))EYE(F,a);
      put(F,23,13,sd);
      const mo=a.mouth||'flat';
      if(mo==='grin'||mo==='smile'){box(F,21,15,6,2,'#40140f');box(F,22,15,4,1,'#ffffff');}
      else if(mo==='snarl'||mo==='fangs'){box(F,21,15,6,2,'#3d1109');put(F,22,15,'#ffffff');put(F,25,15,'#ffffff');}
      else if(mo==='dark')box(F,21,15,6,2,'#1b0a12');
      else if(mo==='smirk'){box(F,22,15,4,1,'#3a1f16');put(F,26,14,'#3a1f16');}
      else box(F,21,15,5,1,'#3a1f16');
      if(a.beard){box(F,18,14,12,4,a.beard);box(F,19,16,10,2,a.beard);}
    }
    const hf=a.hairFront||'none';
    if(!full&&HAIRF[hf==='swoop'||hf==='bangs'||hf==='side'||hf==='stripe'||hf==='peak'?'cap':hf]||HAIRF[hf])
      (HAIRF[hf]||HAIRF.cap)(F,hair);
    if(hf==='stripe'){box(F,17,3,3,5,hair2);}
  }
  if(GEAR[gk])GEAR[gk](F,a);
  if(a.emblem==='x'){box(F,21,24,5,5,s.trim);
    put(F,22,25,'#141109');put(F,24,25,'#141109');put(F,23,26,'#141109');put(F,22,27,'#141109');put(F,24,27,'#141109');}
  else if(a.emblem==='dot')box(F,22,25,4,4,s.b);
  else{box(F,21,23,2,4,s.b);box(F,26,23,2,4,s.b);box(F,23,26,3,2,s.b);}
  (a.front||[]).forEach(f=>{const[k,v]=Array.isArray(f)?f:[f];if(PROP[k])PROP[k](F,v,p);});
  if(a.frontFace)a.frontFace(F);
  return F;
}

const PROP={
  claws:(F,c,p)=>{[p.lf,p.rf].forEach(([x,y])=>{[0,2,4].forEach(o=>box(F,x+o,y-8,1,8,c));});},
  talons:(F,c,p)=>{[p.lf,p.rf].forEach(([x,y])=>{[0,2,3,4].forEach(o=>box(F,x+o,y-5,1,5,c));});},
  staff:(F,c,p)=>{line(F,8,49,38,9,c,1);line(F,9,49,39,9,c,1);box(F,37,6,3,3,'#ff3ea5');},
  sword:(F,c,p)=>{box(F,p.rf[0]+1,p.rf[1]-13,2,13,c);box(F,p.rf[0]-1,p.rf[1]-2,6,1,'#8a6b3a');},
  blade:(F,c,p)=>{box(F,p.rf[0]+1,p.rf[1]-12,3,12,c);},
  coils:(F,c,p)=>{line(F,p.lf[0],p.lf[1]+3,4,56,c,1);line(F,p.rf[0]+4,p.rf[1]+3,44,56,c,1);}
};

const FX={
  lightning:(g)=>{[[5,2],[41,4]].forEach(([x,y])=>{
    const c='#bff2ff';box(g,x,y,2,4,c);box(g,x-1,y+4,2,4,c);box(g,x+1,y+8,2,4,c);box(g,x,y+12,2,3,c);});},
  flames:(g)=>{box(g,14,20,20,30,'#ff7a18');box(g,16,24,16,26,'#ffd23f');box(g,18,16,12,6,'#ff7a18');},

function pixScene(a){
  const g=mk(), top=a.bg[0], bot=a.bg[1];
  const bands=[shade(top,1.06),top,shade(bot,1.15),bot];
  const cuts=[0,10,20,30];
  bands.forEach((c,i)=>box(g,0,cuts[i],W,(cuts[i+1]||40)-cuts[i],c));
  for(let x=0;x<W;x+=2){put(g,x,9,bands[1]);put(g,x+1,19,bands[2]);put(g,x,29,bands[3]);}
  box(g,0,40,W,20,bot);
  const cl=shade(top,1.3);
  [[4,4,9],[30,7,7],[19,3,5],[38,13,6]].forEach(([x,y,w])=>{box(g,x,y,w,2,cl);box(g,x+1,y-1,w-2,1,cl);});
  const m1=shade(bot,.88), m2=shade(bot,.66);
  for(let x=0;x<W;x++){
    const h1=Math.round(12*Math.abs(Math.sin((x+3)/9)));
    const h2=Math.round(9*Math.abs(Math.sin((x+14)/6)));
    box(g,x,40-h1,1,h1,m1);
    box(g,x,44-h2,1,h2+2,m2);
  }
  box(g,0,50,W,10,shade(bot,.52));
  for(let x=0;x<W;x+=2)put(g,x,50,shade(bot,.74));
  for(let x=1;x<W;x+=3)put(g,x,54,shade(bot,.42));
  return g;
}

function pixCard(c){
  const a=c.art, p=poseOf(c), g=pixScene(a);
  (a.fx||[]).forEach(f=>{const[k,v]=Array.isArray(f)?f:[f];if(FX[k])FX[k](g,v);});
  const F=figure(a,p);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=F[y][x]; if(!v)continue;
    F[y][x]= x<=19?shade(v,.82) : x>=29?shade(v,1.16) : v;
  }
  const O=F.map(r=>r.slice());
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(F[y][x])continue;
    if((F[y-1]&&F[y-1][x])||(F[y+1]&&F[y+1][x])||F[y][x-1]||F[y][x+1])O[y][x]='#100d16';
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(O[y][x]&&y+3<H)g[y+3][x]=O[y][x];
  return toSvg(g);
}

function poster(c,i){
  const a=c.art, id='c'+i;
  const edge=c.team==='VILLAIN'?'#c8203f':c.team==='ALLY'?'#127a4b':'#2aa8e0';
  const nm=c.name.toUpperCase();
  const fs=Math.min(56, 300/(nm.length*0.56));
  const panel=a.img
    ? `<image href="${a.img}" x="0" y="0" width="48" height="60" preserveAspectRatio="xMidYMid slice"/>`
    : pixCard(c);
  return frame(panel,id,edge,nm,c.real,fs);
}

<script>
const STATS=['PWR','SPD','MIND','CQC','HEART'];
const grid=document.getElementById('grid'), count=document.getElementById('count');

function cardHtml(c,i){
  const cls=c.team==='X-MEN'?'xmen':c.team==='VILLAIN'?'villain':'ally';
  const st=STATS.map((l,n)=>`<div class="stat"><b>${l}</b><div class="bar"><i style="--w:${c.stats[n]}%"></i></div><u>${c.stats[n]}</u></div>`).join('');
  return `<article class="card" data-team="${c.team}" data-name="${(c.name+' '+c.real+' '+c.powers.join(' ')).toLowerCase()}">
    <div class="face front">
      <div class="art">${poster(c,i)}</div>
      <div class="foil"></div><div class="scan"></div><div class="glare"></div>
      <div class="chips"><span class="badge ${cls}">${c.team}</span><span class="season">${c.season}</span></div>
      <div class="powers">${c.powers.map(p=>`<span>${p}</span>`).join('')}</div>
    </div>
    <div class="face back"><div class="back-in">
      <h4>${c.name}</h4>
      <div class="role">${c.role} &nbsp;&bull;&nbsp; ${c.season}</div>
      <div class="quote">${c.tag}</div>
      <div class="bio">${c.bio}</div>
      <div class="stats">${st}</div>
      <div class="hint">Click to flip back</div>
    </div></div>
  </article>`;
}

grid.innerHTML=DECK.map(cardHtml).join('');

let team='all', term='';
function apply(){
  let n=0;
  grid.querySelectorAll('.card').forEach(el=>{
    const ok=(team==='all'||el.dataset.team===team)&&(!term||el.dataset.name.includes(term));
    el.style.display=ok?'':'none'; if(ok)n++;
  });
  count.textContent=n+' / '+DECK.length+' cards';
}
apply();

document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); team=b.dataset.f; apply();
}));
document.getElementById('q').addEventListener('input',e=>{term=e.target.value.trim().toLowerCase();apply();});

grid.addEventListener('pointermove',e=>{
  const el=e.target.closest('.card'); if(!el||el.classList.contains('flip'))return;
  const r=el.getBoundingClientRect(), px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
  el.style.transform=`rotateY(${(px-.5)*20}deg) rotateX(${(.5-py)*20}deg) translateZ(26px) scale(1.04)`;
  el.style.setProperty('--gx',px*100+'%'); el.style.setProperty('--gy',py*100+'%');
  el.style.setProperty('--fx',px*100+'%'); el.style.setProperty('--fy',py*100+'%');
});
grid.addEventListener('pointerout',e=>{
  const el=e.target.closest('.card');
  if(el&&!el.contains(e.relatedTarget)&&!el.classList.contains('flip'))el.style.transform='';
});
grid.addEventListener('click',e=>{
  const el=e.target.closest('.card'); if(!el)return;
  el.classList.toggle('flip');
  if(!el.classList.contains('flip'))el.style.transform='';
});

</script>
