<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1f2937; } .t { font-size: 30px; font-weight: 700; } .s { font-size: 23px; } .l { font-size: 21px; fill: #374151; }</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
  </defs>
  <rect width="1100" height="1100" fill="#ffffff"/>
  <text x="550" y="60" text-anchor="middle" class="t" style="font-size:38px">DBOS agentic workflow POC</text>

  <g filter="url(#wobble)" stroke="#1f2937" stroke-width="2.5">
    <rect x="50" y="130" width="300" height="190" rx="16" fill="#dbeafe"/>
    <rect x="470" y="110" width="580" height="380" rx="18" fill="#fef3c7"/>
    <rect x="500" y="250" width="520" height="120" rx="12" fill="#ffffff"/>
    <rect x="50" y="370" width="300" height="150" rx="16" fill="#f3e8ff"/>
    <rect x="50" y="680" width="300" height="170" rx="16" fill="#fce7f3"/>
    <rect x="470" y="640" width="580" height="230" rx="18" fill="#dcfce7"/>
  </g>

  <text x="200" y="175" text-anchor="middle" class="t">Browser UI :5193</text>
  <text x="200" y="210" text-anchor="middle" class="s">Vite + React 19 + TanStack</text>
  <text x="200" y="242" text-anchor="middle" class="s">start a goal, live steps</text>
  <text x="200" y="274" text-anchor="middle" class="s">"See it running in DBOS"</text>
  <text x="200" y="302" text-anchor="middle" class="l">opens the journal page</text>

  <text x="760" y="152" text-anchor="middle" class="t">agent-service :9081</text>
  <text x="760" y="186" text-anchor="middle" class="s">Python 3.15 on host, Granian ASGI, no framework</text>
  <text x="760" y="218" text-anchor="middle" class="s">DBOS Transact 3.6 library, inside the process</text>
  <text x="760" y="282" text-anchor="middle" class="t">AgentWorkflow (@DBOS.workflow)</text>
  <text x="760" y="316" text-anchor="middle" class="s">read config -&gt; plan -&gt; task 1..4 -&gt; summarize</text>
  <text x="760" y="350" text-anchor="middle" class="s">each agent call is a @DBOS.step with retries</text>
  <text x="760" y="410" text-anchor="middle" class="s">DBOS.set_event("state") publishes live progress</text>
  <text x="760" y="444" text-anchor="middle" class="s">DBOS.list_workflow_steps feeds the journal page</text>

  <text x="200" y="412" text-anchor="middle" class="t">prompts/</text>
  <text x="200" y="446" text-anchor="middle" class="s">plan-goal.md</text>
  <text x="200" y="476" text-anchor="middle" class="s">execute-task.md</text>
  <text x="200" y="506" text-anchor="middle" class="s">summarize-run.md</text>

  <text x="200" y="722" text-anchor="middle" class="t">agent CLI on host</text>
  <text x="200" y="758" text-anchor="middle" class="l">claude | codex | agy | ollama</text>
  <text x="200" y="792" text-anchor="middle" class="l">picked by scripts/agent.conf</text>
  <text x="200" y="826" text-anchor="middle" class="l">one subprocess per step</text>

  <text x="760" y="684" text-anchor="middle" class="t">Postgres 17 (podman) :5434</text>
  <text x="760" y="720" text-anchor="middle" class="s">DBOS system database, schema dbos</text>
  <text x="760" y="756" text-anchor="middle" class="s">workflow_status: one row per run</text>
  <text x="760" y="790" text-anchor="middle" class="s">operation_outputs: one row per finished step</text>
  <text x="760" y="824" text-anchor="middle" class="s">workflow_events: the published RunState</text>

  <g fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M352,225 Q410,205 466,215"/>
    <path d="M352,440 Q410,440 466,430"/>
    <path d="M466,470 Q380,580 300,676"/>
    <path d="M860,494 Q880,565 860,636"/>
    <path d="M660,636 Q640,565 660,494"/>
  </g>
  <text x="410" y="196" text-anchor="middle" class="l">HTTP</text>
  <text x="410" y="425" text-anchor="middle" class="l">load</text>
  <text x="330" y="610" text-anchor="end" class="l">subprocess</text>
  <text x="885" y="570" class="l">checkpoint each step</text>
  <text x="635" y="555" text-anchor="end" class="l">recover pending</text>
  <text x="635" y="582" text-anchor="end" class="l">runs on restart</text>
</svg>
