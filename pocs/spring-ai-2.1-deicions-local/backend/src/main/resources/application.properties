spring.application.name=decisions-service
server.port=${BACKEND_PORT:8097}
spring.threads.virtual.enabled=true
spring.main.banner-mode=off

spring.ai.model.decision=ollama
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.decision.model=d1-omni:600m
spring.ai.model.chat=none
spring.ai.model.embedding=none

decisions.auto-threshold=0.9
decisions.review-threshold=0.4
decisions.helpfulness-min-level=2.0
decisions.plausible-min-probability=0.5
