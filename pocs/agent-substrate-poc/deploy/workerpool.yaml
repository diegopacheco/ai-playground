apiVersion: v1
kind: Namespace
metadata:
  name: ate-poc-agents
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: memory-agent
  namespace: ate-poc-agents
  labels:
    workload: memory-agent
spec:
  replicas: 2
  workerImage: ko://go.ate.dev/substrate/cmd/ateworker-gvisor
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
