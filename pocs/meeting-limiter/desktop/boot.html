<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meeting Limiter</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f5f5f5; color: #242424; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; place-items: center; -webkit-app-region: drag; user-select: none; }
    .card { width: 440px; max-width: calc(100vw - 32px); background: #fff; border: 1px solid #e0e0e0; border-radius: 16px; padding: 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
    .head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .head img { width: 56px; height: 56px; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 2px 0 0; color: #616161; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid #f0f0f0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #d1d1d1; flex: none; }
    .wait .dot { background: #f2a900; animation: pulse 1s infinite; }
    .ok .dot { background: #107c41; }
    .fail .dot { background: #c50f1f; }
    .label { font-weight: 600; }
    .detail { margin-left: auto; color: #616161; font-size: 12px; max-width: 230px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="head"><img src="../frontend/public/logo.svg" alt=""><div><h1>Meeting Limiter</h1><p>Starting services</p></div></div>
    <ul id="steps">
      <li id="go"><span class="dot"></span><span class="label">Go toolchain</span><span class="detail">checking</span></li>
      <li id="bun"><span class="dot"></span><span class="label">Bun runtime</span><span class="detail">pending</span></li>
      <li id="api"><span class="dot"></span><span class="label">Calendar and wallet API</span><span class="detail">pending</span></li>
      <li id="ui"><span class="dot"></span><span class="label">Calendar UI</span><span class="detail">pending</span></li>
      <li id="people"><span class="dot"></span><span class="label">People and wallets</span><span class="detail">pending</span></li>
    </ul>
  </div>
  <script>
    const LABELS = { ok: "ready", wait: "loading", fail: "failed" };
    window.meetingLimiter.onBoot(({ id, status, detail }) => {
      const row = document.getElementById(id);
      row.className = status;
      row.querySelector(".detail").textContent = detail || LABELS[status];
      row.querySelector(".detail").title = detail || "";
    });
  </script>
</body>
</html>
