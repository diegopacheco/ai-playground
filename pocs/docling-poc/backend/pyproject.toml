[project]
name = "docling-poc"
version = "0.1.0"
description = "Docling document conversion service"
requires-python = ">=3.15"
dependencies = [
    "docling>=2.154.0",
    "granian>=2.8.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ty>=0.0.112",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
