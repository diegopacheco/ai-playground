  <text class="s" x="680" y="502">~/.claude skills,</text>
  <text class="s" x="680" y="526">commands, agents</text>
  <rect class="b" x="660" y="560" width="230" height="60" rx="14" fill="#c5f6fa"/>
  <text class="s" x="680" y="597">~/.codex skills, prompts</text>
  <rect class="b" x="960" y="490" width="210" height="100" rx="14" fill="#eebefa"/>
  <text class="t" x="980" y="530">plugins</text>
  <text class="s" x="980" y="562">claude plugin install</text>
