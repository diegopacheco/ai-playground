  <text class="s" x="685" y="152">cache ~/.cache/ram</text>
  <rect class="b" x="960" y="50" width="210" height="130" rx="14" fill="#e9ecef"/>
  <text class="t" x="985" y="92">GitHub</text>
  <text class="s" x="985" y="124">diegopacheco/</text>
  <text class="s" x="985" y="152">agent-skills</text>
  <rect class="b" x="660" y="270" width="230" height="140" rx="14" fill="#b2f2bb"/>
  <text class="t" x="685" y="312">catalog scan</text>
  <text class="s" x="685" y="344">SKILL.md, commands/,</text>
  <text class="s" x="685" y="372">agents/, marketplace</text>
  <rect class="b" x="330" y="270" width="250" height="140" rx="14" fill="#ffc9c9"/>
  <text class="t" x="355" y="312">picker</text>
  <text class="s" x="355" y="344">type to search,</text>
