<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap');
      text{font-family:'Caveat',cursive;fill:#1e1e1e}
      .t{font-size:30px;font-weight:700}
      .s{font-size:22px}
      .l{font-size:21px;fill:#5b5b5b}
      .b{stroke:#1e1e1e;stroke-width:2.4;filter:url(#w)}
      .a{fill:none;stroke:#1e1e1e;stroke-width:2.4;marker-end:url(#h);filter:url(#w)}
    </style>
    <filter id="w"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <marker id="h" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="2.2"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect class="b" x="40" y="60" width="210" height="110" rx="14" fill="#ffec99"/>
