[package]
name = "ram"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "fs", "time"] }
crossterm = "0.29"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
