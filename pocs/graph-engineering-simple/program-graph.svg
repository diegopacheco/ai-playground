<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title description">
  <title id="title">Directed graph created by build_graph</title>
  <desc id="description">The concrete program graph contains facts, risks, and answer nodes with directed edges from facts to answer and risks to answer.</desc>
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1120" height="650" rx="28" fill="#fffdf8"/>
  <text x="560" y="48" fill="#172033" text-anchor="middle" font-family="Caveat, 'Comic Sans MS', cursive" font-size="32" font-weight="700">Graph created by build_graph(llm)</text>
  <g fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)" filter="url(#wobble)">
    <path d="M430 200 C545 200 580 320 730 320"/>
    <path d="M430 450 C545 450 580 320 730 320"/>
  </g>
  <g stroke="#334155" stroke-width="3" filter="url(#wobble)">
    <rect x="50" y="100" width="380" height="200" rx="22" fill="#dcfce7"/>
    <rect x="50" y="350" width="380" height="200" rx="22" fill="#fef3c7"/>
    <rect x="730" y="210" width="350" height="220" rx="22" fill="#fce7f3"/>
  </g>
  <g fill="#172033" font-family="Caveat, 'Comic Sans MS', cursive">
    <text x="80" y="145" font-size="29" font-weight="700">Node: facts</text>
    <text x="80" y="180" font-size="19">instruction:</text>
    <text x="80" y="208" font-size="19">Identify the essential facts.</text>
    <text x="80" y="241" font-size="19">incoming edges: none</text>
    <text x="80" y="274" font-size="20" font-weight="700">ready in pass 1</text>
    <text x="80" y="395" font-size="29" font-weight="700">Node: risks</text>
    <text x="80" y="430" font-size="19">instruction:</text>
    <text x="80" y="458" font-size="19">Identify assumptions and risks.</text>
    <text x="80" y="491" font-size="19">incoming edges: none</text>
    <text x="80" y="524" font-size="20" font-weight="700">ready in pass 1</text>
    <text x="760" y="255" font-size="29" font-weight="700">Node: answer</text>
    <text x="760" y="290" font-size="19">instruction:</text>
    <text x="760" y="318" font-size="19">Create the final answer.</text>
    <text x="760" y="351" font-size="19">incoming: facts + risks</text>
    <text x="760" y="384" font-size="19">context: both stored results</text>
    <text x="760" y="417" font-size="20" font-weight="700">ready in pass 2</text>
  </g>
  <g fill="#475569" text-anchor="middle" font-family="Caveat, 'Comic Sans MS', cursive" font-size="20">
    <text x="565" y="177">("facts", "answer")</text>
    <text x="565" y="480">("risks", "answer")</text>
  </g>
  <rect x="120" y="580" width="880" height="50" rx="16" fill="#ede9fe" stroke="#334155" stroke-width="2.5" filter="url(#wobble)"/>
  <text x="560" y="612" fill="#172033" text-anchor="middle" font-family="Caveat, 'Comic Sans MS', cursive" font-size="20">Execution order: facts → risks → answer | returned keys: facts, risks, answer</text>
</svg>
