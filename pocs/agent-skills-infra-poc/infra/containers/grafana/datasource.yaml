apiVersion: 1
datasources:
  - name: Loki (agent tenants)
    uid: loki-agents
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: decision-log|answer-grader|bookmarks-mcp|feature-flags-mcp
  - name: Postgres (agentinfra)
    uid: pg-agentinfra
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: agentinfra
    jsonData:
      database: agentinfra
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: agentinfra
