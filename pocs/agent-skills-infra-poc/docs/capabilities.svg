<text x="750.0" y="50" text-anchor="middle" font-size="40" font-weight="700">Agent Infra: capabilities</text><text x="110" y="105" text-anchor="start" font-size="24" font-weight="700">consumers</text><rect x="110" y="120" width="250" height="90" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="235.0" y="162.3" text-anchor="middle" font-size="26" font-weight="700">decision-log</text><text x="235.0" y="186.3" text-anchor="middle" font-size="19">skill</text><path d="M235,212 Q438.5,255.0 630.0,298" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="120" width="250" height="90" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="515.0" y="162.3" text-anchor="middle" font-size="26" font-weight="700">answer-grader</text><text x="515.0" y="186.3" text-anchor="middle" font-size="19">skill</text><path d="M515,212 Q618.5,255.0 710.0,298" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><rect x="670" y="120" width="250" height="90" rx="14" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="795.0" y="162.3" text-anchor="middle" font-size="26" font-weight="700">bookmarks-mcp</text><text x="795.0" y="186.3" text-anchor="middle" font-size="19">MCP server</text><path d="M795,212 Q798.5,255.0 790.0,298" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><rect x="950" y="120" width="250" height="90" rx="14" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="1075.0" y="162.3" text-anchor="middle" font-size="26" font-weight="700">feature-flags-mcp</text><text x="1075.0" y="186.3" text-anchor="middle" font-size="19">MCP server</text><path d="M1075,212 Q978.5,255.0 870.0,298" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><rect x="1250" y="120" width="200" height="90" rx="14" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="1350.0" y="162.3" text-anchor="middle" font-size="26" font-weight="700">evals UI</text><text x="1350.0" y="186.3" text-anchor="middle" font-size="19">React + TanStack</text><rect x="470" y="300" width="560" height="110" rx="14" fill="#ffec99" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="750.0" y="341.8" text-anchor="middle" font-size="26" font-weight="700">agentinfra CLI</text><text x="750.0" y="365.8" text-anchor="middle" font-size="19">bootstrap | token | state | log | eval</text><text x="750.0" y="386.8" text-anchor="middle" font-size="19">caches tokens, prints JSON</text><text x="1045" y="300" text-anchor="start" font-size="19" font-weight="400">exec, one process per call</text><rect x="110" y="530" width="280" height="140" rx="14" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="250.0" y="576.3" text-anchor="middle" font-size="26" font-weight="700">auth :8401</text><text x="250.0" y="600.3" text-anchor="middle" font-size="19">OAuth 2</text><text x="250.0" y="621.3" text-anchor="middle" font-size="19">client credentials</text><text x="250.0" y="642.3" text-anchor="middle" font-size="19">JWT HS256</text><path d="M615.0,412 Q438.5,470.0 250,528" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="530" width="280" height="140" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="580.0" y="586.8" text-anchor="middle" font-size="26" font-weight="700">state :8402</text><text x="580.0" y="610.8" text-anchor="middle" font-size="19">tenant k/v</text><text x="580.0" y="631.8" text-anchor="middle" font-size="19">PUT GET LIST DELETE</text><path d="M705.0,412 Q648.5,470.0 580,528" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><rect x="770" y="530" width="280" height="140" rx="14" fill="#96f2d7" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="910.0" y="586.8" text-anchor="middle" font-size="26" font-weight="700">logs :8403</text><text x="910.0" y="610.8" text-anchor="middle" font-size="19">write + query</text><text x="910.0" y="631.8" text-anchor="middle" font-size="19">per tenant</text><path d="M795.0,412 Q858.5,470.0 910,528" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><rect x="1100" y="530" width="280" height="140" rx="14" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="1240.0" y="586.8" text-anchor="middle" font-size="26" font-weight="700">evals :8404</text><text x="1240.0" y="610.8" text-anchor="middle" font-size="19">9 evaluators</text><text x="1240.0" y="631.8" text-anchor="middle" font-size="19">runs per tenant</text><path d="M885.0,412 Q1068.5,470.0 1240,528" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="110" y="440" text-anchor="start" font-size="21" font-weight="400">HTTP + Bearer token</text><text x="110" y="466" text-anchor="start" font-size="21" font-weight="400">(tenant = sub claim)</text><path d="M1360,212 Q1316.0,370.0 1260,528" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="1330" y="380" text-anchor="start" font-size="19" font-weight="400">token from auth,</text><text x="1330" y="402" text-anchor="start" font-size="19" font-weight="400">evals:read:all</text><rect x="335" y="850" width="290" height="120" rx="14" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="480.0" y="896.8" text-anchor="middle" font-size="26" font-weight="700">Postgres</text><text x="480.0" y="920.8" text-anchor="middle" font-size="19">kv + eval tables</text><text x="480.0" y="941.8" text-anchor="middle" font-size="19">Row Level Security</text><rect x="685" y="850" width="290" height="120" rx="14" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="830.0" y="907.3" text-anchor="middle" font-size="26" font-weight="700">Loki</text><text x="830.0" y="931.3" text-anchor="middle" font-size="19">X-Scope-OrgID = tenant</text><rect x="1035" y="850" width="290" height="120" rx="14" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="1180.0" y="907.3" text-anchor="middle" font-size="26" font-weight="700">Grafana</text><text x="1180.0" y="931.3" text-anchor="middle" font-size="19">browse all tenants</text><path d="M580,672 Q531.0,760.0 470,848" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="400" y="770" text-anchor="middle" font-size="19">SET LOCAL app.tenant</text><path d="M1220,672 Q920.0,760.0 560,848" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><path d="M910,672 Q876.0,760.0 830,848" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="965" y="822" text-anchor="middle" font-size="19">push / query</text><path d="M1035,912 Q1014.0,911.0 977,910" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="1180" y="1005" text-anchor="middle" font-size="21" font-weight="400">all three run in podman</text><text x="110" y="1055" text-anchor="start" font-size="21" font-weight="400">Every capability is an API. Consumers only call the CLI. Isolation is enforced in code and again in the store.</text></svg>