<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="890" viewBox="0 0 1500 890">
<style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=block');text{font-family:'Caveat','Chalkboard SE','Comic Sans MS',cursive;fill:#1e1e1e}</style>
<defs>
<filter id="w" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
</defs>
<rect width="1500" height="890" fill="#ffffff"/>
<text x="750.0" y="48" text-anchor="middle" font-size="34" font-weight="700">Evals: run a suite, grade on the server, browse in the UI</text><rect x="25" y="80" width="210" height="70" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="130.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">suite.json</text><path d="M130,152 Q134,496.0 130,840" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><rect x="285" y="80" width="210" height="70" rx="14" fill="#ffec99" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="390.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">agentinfra CLI</text><path d="M390,152 Q394,496.0 390,840" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><rect x="545" y="80" width="210" height="70" rx="14" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="650.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">evals</text><path d="M650,152 Q654,496.0 650,840" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><rect x="805" y="80" width="210" height="70" rx="14" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="910.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">Postgres (RLS)</text><path d="M910,152 Q914,496.0 910,840" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><rect x="1065" y="80" width="210" height="70" rx="14" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="1170.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">evals UI</text><path d="M1170,152 Q1174,496.0 1170,840" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><path d="M138,205 Q260.0,198.0 382,205" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="260.0" y="188.0" text-anchor="middle" font-size="18">eval run suite.json</text><path d="M394,253 Q450,255 440,275 Q424,283 396,279" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="454" y="271" text-anchor="start" font-size="18" font-weight="400">run each command, keep output + latency</text><path d="M398,329 Q520.0,322.0 642,329" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="520.0" y="312.0" text-anchor="middle" font-size="18">POST /v1/evals/runs {suite, cases}</text><path d="M654,377 Q710,379 700,399 Q684,407 656,403" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="714" y="395" text-anchor="start" font-size="18" font-weight="400">grade every check, common evaluators</text><path d="M658,453 Q780.0,446.0 902,453" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="780.0" y="436.0" text-anchor="middle" font-size="18">INSERT run + cases as tenant</text><path d="M642,515 Q520.0,508.0 398,515" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="520.0" y="498.0" text-anchor="middle" font-size="18">201 {score, passed, failed}</text><path d="M1162,577 Q910.0,570.0 658,577" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="910.0" y="560.0" text-anchor="middle" font-size="18">GET /v1/evals/runs (evals:read:all)</text><path d="M658,639 Q780.0,632.0 902,639" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="780.0" y="622.0" text-anchor="middle" font-size="18">SET LOCAL app.read_all = on</text><path d="M902,701 Q780.0,694.0 658,701" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="780.0" y="684.0" text-anchor="middle" font-size="18">runs of every tenant</text><path d="M658,763 Q910.0,756.0 1162,763" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="910.0" y="746.0" text-anchor="middle" font-size="18">table, health cards, detail</text><text x="40" y="874" text-anchor="start" font-size="20" font-weight="400">Consumers only produce outputs. One shared grader keeps scores comparable.</text></svg>