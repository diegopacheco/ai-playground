<rect width="1500" height="1076" fill="#ffffff"/>
<text x="750.0" y="48" text-anchor="middle" font-size="34" font-weight="700">OAuth 2 + tenant state: a skill writes a decision</text><rect x="25" y="80" width="210" height="70" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="130.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">decision-log skill</text><path d="M130,152 Q134,589.0 130,1026" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><rect x="285" y="80" width="210" height="70" rx="14" fill="#ffec99" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="390.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">agentinfra CLI</text><path d="M390,152 Q394,589.0 390,1026" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><rect x="545" y="80" width="210" height="70" rx="14" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="650.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">auth</text><path d="M650,152 Q654,589.0 650,1026" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><rect x="805" y="80" width="210" height="70" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="910.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">state</text><path d="M910,152 Q914,589.0 910,1026" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><rect x="1065" y="80" width="210" height="70" rx="14" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2.2" filter="url(#w)"/><text x="1170.0" y="121.9" text-anchor="middle" font-size="23" font-weight="700">Postgres (RLS)</text><path d="M1170,152 Q1174,589.0 1170,1026" fill="none" stroke="#868e96" stroke-width="1.6" stroke-dasharray="6 7"/><path d="M138,205 Q260.0,198.0 382,205" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="260.0" y="188.0" text-anchor="middle" font-size="18">state put adr/use-rls {...}</text><path d="M394,253 Q450,255 440,275 Q424,283 396,279" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="454" y="271" text-anchor="start" font-size="18" font-weight="400">cached token valid? no</text><path d="M398,329 Q520.0,322.0 642,329" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="520.0" y="312.0" text-anchor="middle" font-size="18">POST /oauth/token (Basic client_id:pw)</text><path d="M654,377 Q710,379 700,399 Q684,407 656,403" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="714" y="395" text-anchor="start" font-size="18" font-weight="400">PBKDF2 check, sign JWT sub=decision-log</text><path d="M642,453 Q520.0,446.0 398,453" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="520.0" y="436.0" text-anchor="middle" font-size="18">access_token, expires_in 900</text><path d="M398,515 Q650.0,508.0 902,515" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="650.0" y="498.0" text-anchor="middle" font-size="18">PUT /v1/state/adr/use-rls (Bearer)</text><path d="M914,563 Q970,565 960,585 Q944,593 916,589" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="974" y="581" text-anchor="start" font-size="18" font-weight="400">verify JWT, needs state:write</text><path d="M918,639 Q1040.0,632.0 1162,639" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="1040.0" y="622.0" text-anchor="middle" font-size="18">BEGIN; SET LOCAL app.tenant</text><path d="M918,701 Q1040.0,694.0 1162,701" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="1040.0" y="684.0" text-anchor="middle" font-size="18">UPSERT kv (tenant, key, value)</text><path d="M1174,749 Q1230,751 1220,771 Q1204,779 1176,775" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/><text x="1234" y="767" text-anchor="start" font-size="18" font-weight="400">WITH CHECK tenant = app.tenant</text><path d="M1162,825 Q1040.0,818.0 918,825" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="1040.0" y="808.0" text-anchor="middle" font-size="18">row</text><path d="M902,887 Q650.0,880.0 398,887" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="650.0" y="870.0" text-anchor="middle" font-size="18">200 {key, value, updated_at}</text><path d="M382,949 Q260.0,942.0 138,949" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="260.0" y="932.0" text-anchor="middle" font-size="18">JSON on stdout</text><text x="40" y="1060" text-anchor="start" font-size="20" font-weight="400">A token of another tenant runs the same SQL, but RLS returns no rows: 404, never the data.</text></svg>