services:
  postgres:
    build: infra/containers/postgres
    container_name: agentinfra-postgres
    environment:
      POSTGRES_USER: agentinfra
      POSTGRES_PASSWORD: agentinfra
      POSTGRES_DB: agentinfra
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - agentinfra-pg:/var/lib/postgresql/data
  loki:
    build: infra/containers/loki
    container_name: agentinfra-loki
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    volumes:
      - agentinfra-loki:/loki
  grafana:
    build: infra/containers/grafana
    container_name: agentinfra-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agent-infra.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    depends_on:
      - loki

volumes:
  agentinfra-pg:
  agentinfra-loki:
