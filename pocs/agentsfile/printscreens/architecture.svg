<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3b3f5c"/></marker>
  </defs>
  <rect width="1000" height="1000" fill="#fffdf8"/>
  <g font-family="Caveat, 'Comic Sans MS', cursive" fill="#2b2f45" text-anchor="middle">
    <text x="500" y="52" font-size="40">Agentsfile architecture</text>
    <g filter="url(#wobble)" stroke="#3b3f5c" stroke-width="2.5">
      <rect x="370" y="90" width="260" height="80" rx="14" fill="#ffe8a3"/>
      <rect x="170" y="240" width="660" height="100" rx="14" fill="#cfe8ff"/>
      <rect x="25" y="430" width="165" height="80" rx="14" fill="#d6f5df"/>
      <rect x="215" y="430" width="165" height="80" rx="14" fill="#ffd9c7"/>
      <rect x="405" y="430" width="165" height="80" rx="14" fill="#e7dcff"/>
      <rect x="595" y="430" width="165" height="80" rx="14" fill="#c9f1f1"/>
      <rect x="785" y="430" width="190" height="80" rx="14" fill="#ffd6e8"/>
      <rect x="60" y="620" width="480" height="110" rx="14" fill="#f1f1f1"/>
      <rect x="625" y="620" width="330" height="110" rx="14" fill="#ffd9c7"/>
      <rect x="60" y="830" width="480" height="110" rx="14" fill="#fff1c9" stroke-dasharray="8 6"/>
      <rect x="625" y="830" width="330" height="110" rx="14" fill="#ffe0e0"/>
    </g>
    <text x="500" y="130" font-size="30">Agentsfile</text>
    <text x="500" y="158" font-size="20">version + profiles</text>
    <text x="500" y="278" font-size="28">spec/SPEC.md: same pipeline in every SDK</text>
    <text x="500" y="316" font-size="24">lexer  ->  parser  ->  schema validator</text>
    <text x="107" y="466" font-size="26">Python</text>
    <text x="107" y="494" font-size="18">uv + ty + pytest</text>
    <text x="297" y="466" font-size="26">Rust</text>
    <text x="297" y="494" font-size="18">cargo, no deps</text>
    <text x="487" y="466" font-size="26">Java</text>
    <text x="487" y="494" font-size="18">Java 25 + Maven</text>
    <text x="677" y="466" font-size="26">Go</text>
    <text x="677" y="494" font-size="18">standard library</text>
    <text x="880" y="466" font-size="26">TypeScript</text>
    <text x="880" y="494" font-size="18">TS 7 + Bun</text>
    <text x="300" y="660" font-size="28">typed model</text>
    <text x="300" y="692" font-size="20">Profile: skills, agents, commands, mcps</text>
    <text x="300" y="716" font-size="20">or "line L, col C: message"</text>
    <text x="790" y="660" font-size="28">agentsfile-lint (Rust)</text>
    <text x="790" y="692" font-size="20">every schema error</text>
    <text x="790" y="716" font-size="20">+ warnings W001..W005</text>
    <text x="300" y="870" font-size="28">spec/fixtures</text>
    <text x="300" y="902" font-size="20">30 invalid with # expect, 2 valid</text>
    <text x="300" y="926" font-size="20">run by the tests of every SDK</text>
    <text x="790" y="870" font-size="28">diagnostics</text>
    <text x="790" y="902" font-size="20">path:line:col: level[CODE]</text>
    <text x="790" y="926" font-size="20">exit 1 on any error</text>
  </g>
  <g fill="none" stroke="#3b3f5c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M500 172 Q512 205 500 236"/>
    <path d="M260 342 Q150 380 110 426"/>
    <path d="M380 342 Q310 385 298 426"/>
    <path d="M500 342 Q478 385 488 426"/>
    <path d="M620 342 Q672 385 676 426"/>
    <path d="M740 342 Q850 380 878 426"/>
    <path d="M107 512 Q150 580 200 616"/>
    <path d="M297 512 Q285 570 290 616"/>
    <path d="M487 512 Q430 580 390 616"/>
    <path d="M677 512 Q560 560 500 616"/>
    <path d="M880 512 Q640 540 535 625"/>
    <path d="M330 512 Q600 540 700 616"/>
    <path d="M790 732 Q805 780 790 826"/>
  </g>
  <g fill="none" stroke="#b07d00" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M300 828 Q330 780 300 734"/>
  </g>
</svg>
