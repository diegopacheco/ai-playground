services:
  webapp:
    image: ghcr.io/triggerdotdev/trigger.dev:v4.8.5
    container_name: triggerdev-poc-webapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8030:3000"
    depends_on:
      - postgres
      - redis
      - clickhouse
      - s2
    environment:
      APP_ORIGIN: http://localhost:8030
      LOGIN_ORIGIN: http://localhost:8030
      API_ORIGIN: http://localhost:8030
      ELECTRIC_ORIGIN: http://electric:3000
      REALTIME_STREAMS_DEFAULT_VERSION: v2
      REALTIME_STREAMS_S2_BASIN: trigger-realtime
      REALTIME_STREAMS_S2_ENDPOINT: http://s2/v1
      REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS: "true"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/main?schema=public&sslmode=disable
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/main?schema=public&sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      MAGIC_LINK_SAME_BROWSER_REQUIRED: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PROVIDER_SECRET: ${PROVIDER_SECRET}
      COORDINATOR_SECRET: ${COORDINATOR_SECRET}
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS_DISABLED: "true"
      APP_LOG_LEVEL: info
      DEV_OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:8030/otel
      DEPLOY_REGISTRY_HOST: localhost:5000
      DEPLOY_REGISTRY_NAMESPACE: trigger
      OBJECT_STORE_BASE_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: admin
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY}
      GRACEFUL_SHUTDOWN_TIMEOUT: "1000"
      ORG_CREATION_API_ENABLED: "1"
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123?secure=false
      CLICKHOUSE_LOG_LEVEL: info
      RUN_REPLICATION_ENABLED: "1"
      RUN_REPLICATION_CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123
      RUN_REPLICATION_LOG_LEVEL: info
      EVENT_REPOSITORY_DEFAULT_STORE: postgres
      EVENT_REPOSITORY_V1_REROUTE_ENABLED: "1"
      INTERNAL_OTEL_TRACE_LOGGING_ENABLED: "0"

  postgres:
    image: docker.io/library/postgres:14
    container_name: triggerdev-poc-postgres
    restart: unless-stopped
    command: ["-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - trigger-postgres:/var/lib/postgresql/data/

  redis:
    image: docker.io/library/redis:7
    container_name: triggerdev-poc-redis
    restart: unless-stopped
    volumes:
      - trigger-redis:/data

  electric:
    image: docker.io/electricsql/electric:1.2.4
    container_name: triggerdev-poc-electric
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/main?schema=public&sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.2
    container_name: triggerdev-poc-clickhouse
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - trigger-clickhouse:/var/lib/clickhouse
      - ./clickhouse/data-paths.xml:/etc/clickhouse-server/config.d/data-paths.xml:ro
      - ./clickhouse/override.xml:/etc/clickhouse-server/config.d/override.xml:ro
      - ./clickhouse/users-override.xml:/etc/clickhouse-server/users.d/override.xml:ro

  minio:
    image: docker.io/bitnamilegacy/minio:latest
    container_name: triggerdev-poc-minio
    restart: unless-stopped
    volumes:
      - trigger-minio:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY}
      MINIO_DEFAULT_BUCKETS: packets
      MINIO_BROWSER: "off"

  s2-init:
    image: docker.io/library/busybox:1.37
    container_name: triggerdev-poc-s2-init
    restart: "no"
    command:
      - sh
      - -c
      - 'printf ''{"basins":[{"name":"trigger-realtime","config":{"create_stream_on_append":true,"create_stream_on_read":true}}]}'' > /config/s2-spec.json'
    volumes:
      - trigger-s2-config:/config

  s2:
    image: ghcr.io/s2-streamstore/s2:latest@sha256:d6ded5ca7dd619fa7c946f06e39a98f9c95c6883c8bb884e5eaa129f232c920c
    container_name: triggerdev-poc-s2
    restart: unless-stopped
    command: ["lite", "--init-file", "/config/s2-spec.json", "--local-root", "/data"]
    user: "0:0"
    volumes:
      - trigger-s2-config:/config
      - trigger-s2:/data

volumes:
  trigger-postgres: {}
  trigger-redis: {}
  trigger-clickhouse: {}
  trigger-minio: {}
  trigger-s2: {}
  trigger-s2-config: {}
