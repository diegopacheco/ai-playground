[project]
name = "triggerdev-agent-api"
version = "1.0.0"
requires-python = ">=3.15"
dependencies = ["granian==2.8.8"]

[dependency-groups]
dev = ["pytest==9.2.0", "ty==0.0.105"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_api"

[tool.pytest.ini_options]
testpaths = ["tests"]
